                - generic [ref=f1e4]:
                  - generic [ref=f1e8]:
                    - paragraph
                    - heading "Introduction" [level=1] [ref=f1e9]:
                      - generic [ref=f1e10]: Introduction
                    - heading "Objective" [level=2] [ref=f1e11]
                    - 'heading "Checkout Part 1 link: https://www.kaggle.com/code/vinayaktiwari28/llm-low-code-starter-part-1 for better understanding" [level=4] [ref=f1e12]':
                      - text: "Checkout Part 1 link:"
                      - link "https://www.kaggle.com/code/vinayaktiwari28/llm-low-code-starter-part-1" [ref=f1e13] [cursor=pointer]:
                        - /url: https://www.kaggle.com/code/vinayaktiwari28/llm-low-code-starter-part-1
                      - text: for better understanding
                    - heading "This Notebook is just a guide to understand how RAG works and how can we modify it according to this competitions requiremetns. Using Llama 2.0, Langchain Llamaindex to create a Retrieval Augmented Generation (RAG) system. This will allow us to ask questions about our documents (that were not included in the training data), without fine-tunning the Large Language Model (LLM)." [level=4] [ref=f1e14]
                    - heading "When using RAG, if you are given a question, you first do a retrieval step to fetch any relevant documents from a special database, a vector database where these documents were indexed.We will be specifically using CSV file in this tutorial for giving context information to our LLM" [level=4] [ref=f1e15]
                    - heading "Definitions" [level=2] [ref=f1e16]
                    - list [ref=f1e17]:
                      - listitem [ref=f1e18]:
                        - heading "LLM - Large Language Model" [level=4] [ref=f1e19]
                      - listitem [ref=f1e20]:
                        - heading "Llama 2.0 - LLM from Meta" [level=4] [ref=f1e21]
                      - listitem [ref=f1e22]:
                        - heading "Langchain - a framework designed to simplify the creation of applications using LLMs" [level=4] [ref=f1e23]
                      - listitem [ref=f1e24]:
                        - heading "Vector database - a database that organizes data through high-dimmensional vectors" [level=4] [ref=f1e25]
                      - listitem [ref=f1e26]:
                        - heading "SimpleVectorStore - vector database" [level=4] [ref=f1e27]
                      - listitem [ref=f1e28]:
                        - heading "RAG - Retrieval Augmented Generation (see below more details about RAGs)" [level=4] [ref=f1e29]
                    - heading "Model details" [level=2] [ref=f1e30]
                    - list [ref=f1e31]:
                      - listitem [ref=f1e32]:
                        - 'heading "Model: Llama 2" [level=4] [ref=f1e33]':
                          - strong [ref=f1e34]: Model
                          - text: ": Llama 2"
                      - listitem [ref=f1e35]:
                        - 'heading "Variation: 7b-chat-hf (7b: 7B dimm. hf: HuggingFace build)" [level=4] [ref=f1e36]':
                          - strong [ref=f1e37]: Variation
                          - text: ": 7b-chat-hf (7b: 7B dimm. hf: HuggingFace build)"
                    - paragraph [ref=f1e38]: LlaMA 2 model is pretrained and fine-tuned with 2 Trillion tokens and 7 to 70 Billion parameters which makes it one of the powerful open source models. It is a highly improvement over LlaMA 1 model.
                    - heading "Retrieval Augmented Generation (RAG) Systems with LlamaIndex+Langchain" [level=1] [ref=f1e39]
                    - heading "Large Language Models (LLMs) have demonstrated their capability to comprehend context and provide accurate responses across various natural language processing (NLP) tasks such as summarization and question answering (Q&A) when prompted. However, they often produce inaccurate responses or \"hallucinate\" when queried about topics beyond their training data. Retrieval Augmented Generation (RAG) addresses this limitation by combining external resources with LLMs, employing a retriever and a generator as its main components." [level=4] [ref=f1e40]
                    - list [ref=f1e41]:
                      - listitem [ref=f1e42]:
                        - heading "Integration with Langchain and LLamaIndex" [level=4] [ref=f1e43]
                    - heading "The orchestration of the retriever and generator is facilitated by Langchain, a platform that seamlessly integrates various components of NLP systems. Langchain provides specialized functions that enable the creation of retriever-generator systems with minimal code, streamlining the development process. Additionally, LLamaIndex, another component, augments Langchain's capabilities by providing advanced indexing and retrieval functionalities, further enhancing the overall performance of the system. Together, Langchain and LLamaIndex form a powerful toolkit for building and deploying state-of-the-art NLP applications." [level=4] [ref=f1e44]
                    - list [ref=f1e45]:
                      - listitem [ref=f1e46]:
                        - heading "The Retriever Component" [level=4] [ref=f1e47]
                    - heading "The retriever component serves to encode the available data, enabling easy retrieval of relevant information upon querying. This encoding is achieved using text embeddings, where a model is trained to create a vector representation of the information. A vector database is considered the best option for implementing a retriever, with various options available, including both open source and commercial products such as ChromaDB, Mevius, FAISS, Pinecone, Weaviate, and Simple Vector Store. In this notebook, we'll utilize a local instance of ChromaDB for persistent storage." [level=4] [ref=f1e48]
                    - list [ref=f1e49]:
                      - listitem [ref=f1e50]:
                        - heading "The Generator Component" [level=4] [ref=f1e51]
                    - heading "The generator component, on the other hand, relies on LLMs to produce responses. Here, we'll utilize a quantized version of the LLaMA v2 model from the Kaggle Models collection." [level=4] [ref=f1e52]
